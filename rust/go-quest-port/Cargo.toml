[package]
name = "go-quest-port"
version = "0.1.0"
edition = "2021"
description = "Offline Rust port of the Go Discord Quest project's models, filtering, scheduling and status analysis"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
