[package]
name = "go-quest-port"
version = "0.2.0"
edition = "2021"
description = "Rust Quest offline status analyzer with opt-in read-only public config and OAuth2 identity HTTP checks"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
