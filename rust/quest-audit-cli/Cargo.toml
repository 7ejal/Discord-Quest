[package]
name = "quest-audit-cli"
version = "0.1.0"
edition = "2021"
description = "Offline, credential-free analyzer for synthetic or locally provided Discord Quest JSON"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
